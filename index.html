<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>步道即時人流與 AI 預測儀表板</title>
  <!-- Chart.js 繪圖庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
    
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 16px; }
    .status-val { font-size: 32px; font-weight: bold; }
    
    /* 燈號顏色樣式 */
    .status-low { color: #2ecc71; }
    .status-medium { color: #f39c12; }
    .status-high { color: #e74c3c; }
    
    .chart-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

<div class="container">
  <h1>🌲 步道即時人流監測與預測系統</h1>

  <!-- 即時狀態卡片 -->
  <div class="card-grid">
    <div class="card">
      <h3>當前現場估計人數</h3>
      <div id="currentCount" class="status-val">載入中...</div>
    </div>
    <div class="card">
      <h3>AI 預測擁擠等級</h3>
      <div id="crowdLevel" class="status-val">載入中...</div>
    </div>
  </div>

  <!-- 折線圖卡片 -->
  <div class="chart-card">
    <h3>未來 1 小時 AI 預測趨勢 (Prophet)</h3>
    <canvas id="forecastChart"></canvas>
  </div>
</div>

<script>
  // 1. Firebase 初始化設定 (請填入你的專案資訊)
  const firebaseConfig = {
    databaseURL: "https://dtrl-182a4-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // 2. 初始化 Chart.js 圖表
  const ctx = document.getElementById('forecastChart').getContext('2d');
  const forecastChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: '預測人數 (yhat)',
        data: [],
        borderColor: '#3498db',
        backgroundColor: 'rgba(52, 152, 219, 0.1)',
        borderWidth: 2,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { title: { display: true, text: '時間' } },
        y: { title: { display: true, text: '估計人數' }, beginAtZero: true }
      }
    }
  });

  // 3. 即時監聽 Firebase 人數資料
  database.ref('sensor/current_count').on('value', (snapshot) => {
    const val = snapshot.val() || 0;
    document.getElementById('currentCount').innerText = `${val} 人`;
  });

  // 4. 即時監聽 Firebase 擁擠等級資料
  database.ref('prediction/level').on('value', (snapshot) => {
    const level = snapshot.val() || 'low';
    const levelElement = document.getElementById('crowdLevel');
    
    if (level === 'low') {
      levelElement.innerText = '🟢 舒適 (Low)';
      levelElement.className = 'status-val status-low';
    } else if (level === 'medium') {
      levelElement.innerText = '🟡 普通 (Medium)';
      levelElement.className = 'status-val status-medium';
    } else {
      levelElement.innerText = '🔴 擁擠 (High)';
      levelElement.className = 'status-val status-high';
    }
  });

  // 5. 即時監聽 AI 預測數據並更新圖表
  database.ref('crowd_forecast').on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    const labels = [];
    const points = [];

    // 格式化時間與點位數據
    Object.keys(data).sort().forEach(key => {
      // key 格式為 YYYYMMDDHHMM -> 取出 HH:MM
      const timeStr = `${key.substring(8, 10)}:${key.substring(10, 12)}`;
      labels.push(timeStr);
      points.push(data[key].predicted);
    });

    forecastChart.data.labels = labels;
    forecastChart.data.datasets[0].data = points;
    forecastChart.update();
  });
</script>

</body>
</html>
